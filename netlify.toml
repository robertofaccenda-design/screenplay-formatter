[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."format"]
  timeout = 30

[functions."analyze"]
  timeout = 30

[functions."character-sheets"]
  timeout = 30

[functions."breakdown"]
  timeout = 30

[functions."location-sheets"]
  timeout = 30

[dev]
  command = "npm run dev"
  port = 3000
  targetPort = 5173

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
